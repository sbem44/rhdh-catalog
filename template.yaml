apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: HTTP-testing
  title: Http testing for POST and GET v4.4
  description: Testing http request functionalities with POST and GET
spec:
  owner: a-team
  ownedBy: group:default/a-team
  type: service
  parameters:
    - title: Insert parameters 
      properties:
        functionalArea:
          title: Functional area
          type: string
          description: The functional area of new project
          ui:autofocus: true
        category:
          title: Category
          type: string
          ui:field: DynamicPickExtension
          ui:options:
            # IMPORTANT: The endpoint needs to return a JSON array of strings.
            external_data: https://demo4654476.mockable.io/categories


  steps:
    - id: post-project
      name: Create new project
      action: http:backstage:request
      input:
        method: 'POST'
        path: '/proxy/mockapi/api/v1/project'
        headers:
          content-type: 'application/json'
        body:
          area: ${{ parameters.functionalArea }}
    - id: get-projects
      name: Retrieve all projects
      action: http:backstage:request
      input:
        method: 'GET'
        path: '/proxy/mockapi/api/v1/project'
  output:
    text:
    - title: Projects
      content: |
        `${{ steps['get-projects'].output.body | dump}}`
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: user-info-test
  title: User info testing v3.0
  description: Testing retrive user info
spec:
  owner: a-team
  ownedBy: group:default/a-team
  type: service
  parameters:
    - title: Insert parameters 
      properties:
        functionalArea:
          title: Functional area
          type: string
          description: The functional area of new project
          ui:autofocus: true
        category:
          title: Category
          type: string
          ui:field: DynamicPickExtension
          ui:options:
            # IMPORTANT: The endpoint needs to return a JSON array of strings.
            external_data: https://demo4654476.mockable.io/categories
        componentOwner:
          title: User
          type: string
          description: User that runs the template
          default: ${{ user.ref }}
          # ui:readonly: true
          # ui:widget: hidden
          ui:field: OwnerPicker
         # ui:backstage:
           # review:
           #   show: false

  steps:
    - id: log-hello-ref
      name: Say hello to the logged in user
      action: debug:log
      input:
        message: Hello ${{ user.ref }}      
  output:
    text:
    - title: Projects
      content: |
        `${{ steps['get-projects'].output.body | dump}}`
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: conditional-step
  title: Conditional step
  description: test conditional fields 
spec:
  owner: a-team
  ownedBy: group:default/a-team
  type: service
  parameters:
    parameters:
      - title: Fill in some steps
        properties:
          includeName:
            title: Include Name?
            type: boolean
            default: true
    
        dependencies:
          includeName:
            allOf:
              - if:
                  properties:
                    includeName:
                      const: true
                then:
                  properties:
                    lastName:
                      title: Last Name
                      type: string
                  # You can use additional fields of parameters within conditional parameters such as required.
                  required:
                    - lastName

  steps:
    - id: log-hello-ref
      name: Say hello
      action: debug:log
      input:
        message: Hello ${{ parameters.lastName }}      
  output:
    text:
    - title: Projects
      content: |
        `${{ steps['get-projects'].output.body | dump}}`
