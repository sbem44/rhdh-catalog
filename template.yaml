      action: debug:log
      input:
        message: Hello ${{ user.ref }}      
  output:
    text:
    - title: Projects
      content: |
        `${{ steps['get-projects'].output.body | dump}}`
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: conditional-step
  title: Conditional step v1.0
  description: test conditional fields 
spec:
  owner: a-team
  ownedBy: group:default/a-team
  type: service
  parameters:
    - title: Choose if last name is required 
      properties:
        includeName:
          title: Include last name?
          type: boolean
          default: true
    - title: Write your name
      required:
        - name
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the component
          ui:autofocus: true
      dependencies:
        includeName:
          allOf:
            - if:
                properties:
                  includeName:
                    const: true
              then:
                properties:
                  lastName:
                    title: Last Name
                    type: string
                # You can use additional fields of parameters within conditional parameters such as required.
                required:
                  - lastName

  steps:
    - id: log-hello-ref
      name: Say hello
      action: debug:log
      input:
        message: Hello ${{ parameters.lastName }}      
  output:
    text:
    - title: Projects
      content: |
        `${{ steps['get-projects'].output.body | dump}}`
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: conditional-step
  title: Conditional Step Example 2
  description: Demonstrates how to use conditional fields across different parameter steps.
  tags:
    - experimental
    - tutorial
spec:
  owner: a-team
  type: service
  parameters:
    # Step 1: Control Flag
    - title: Choose Name Requirements
      properties:
        includeName:
          title: Include Last Name?
          type: boolean
          description: If checked, a 'Last Name' field will appear below and be required.
          default: true
    
    # Step 2: Name Input (Conditional field defined here)
    - title: Write Your Name
      required:
        - name # 'name' is always required
      properties:
        name:
          title: First Name
          type: string
          description: Unique first name of the component owner.
          ui:autofocus: true
        
        # --- CONDITIONAL LOGIC START ---
      dependencies:
        # The dependency key (includeName) must match the field controlling the condition
        includeName:
          allOf:
            - if:
                properties:
                  includeName:
                    const: true # Condition: If 'includeName' is true
              then:
                properties:
                  lastName: # The conditional field
                    title: Last Name
                    type: string
                    description: The last name (Required when 'Include Last Name' is checked).
                required:
                  - lastName # Make 'lastName' required only when the condition is met
              else:
                properties:
                  lastName: # Define the field even when it's hidden (to ensure it's in the final parameters)
                    title: Last Name (Optional/Hidden)
                    type: string
                    description: The last name (Not required when unchecked).
                    default: "" # IMPORTANT: Set a default value when hidden/optional to ensure the input is not null
        # --- CONDITIONAL LOGIC END ---

  steps:
    - id: log-hello-ref
      name: Say Hello
      action: debug:log
      input:
        message: >
          Hello, ${{ parameters.name }}${{ parameters.lastName ? ' ' + parameters.lastName : ' (No Last Name Provided)' }}!
          The 'includeName' flag was set to: ${{ parameters.includeName }}
    
    - id: done
      name: Mark as complete
      action: roadiehq:utils:jsonata
      input:
        expression: "Congratulations! The template execution is complete."
        data: {}
      
  output:
    text: Template run successfully!
